# Pre-commit hooks for dotfiles repository
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Fix trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # Ensure files end with a newline
      - id: end-of-file-fixer
      # Check for files that would conflict in case-insensitive filesystems
      - id: check-case-conflict
      # Check for merge conflicts
      - id: check-merge-conflict
      # Check for added large files (prevent large files per tenant #7)
      - id: check-added-large-files
        args: ['--maxkb=500']
      # Detect private keys
      - id: detect-private-key
      # Check YAML syntax
      - id: check-yaml
      # Fix mixed line endings
      - id: mixed-line-ending
        args: ['--fix=lf']
      # Check for symlinks that point to nothing
      - id: check-symlinks
      # Check for broken symlinks
      - id: destroyed-symlinks

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        # Exclude ZSH files as shellcheck doesn't support ZSH syntax
        exclude: '^(zsh/|lib/post-merge|.*\.zsh$)'
