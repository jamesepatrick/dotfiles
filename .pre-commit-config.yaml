# Pre-commit hooks for dotfiles repository
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Fix trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # Ensure files end with a newline
      - id: end-of-file-fixer
      # Check for files that would conflict in case-insensitive filesystems
      - id: check-case-conflict
      # Check for merge conflicts
      - id: check-merge-conflict
      # Check for added large files (prevent large files per tenant #7)
      - id: check-added-large-files
        args: ['--maxkb=500']
      # Detect private keys
      - id: detect-private-key
      # Check YAML syntax
      - id: check-yaml
      # Check JSON syntax
      - id: check-json
      # Check TOML syntax
      - id: check-toml
      # Check XML syntax
      - id: check-xml
      # Fix mixed line endings
      - id: mixed-line-ending
        args: ['--fix=lf']
      # Check for symlinks that point to nothing
      - id: check-symlinks
      # Check for broken symlinks
      - id: destroyed-symlinks
      # Ensure executable files have shebangs
      - id: check-executables-have-shebangs
        # Exclude config files that are sourced, not executed
        exclude: '^(tmux/tmux\.conf|zsh/modules/prompt/uncommon\.zsh)$'
      # Ensure scripts with shebangs are executable
      - id: check-shebang-scripts-are-executable
        # Exclude ZSH dotfiles that are sourced by the shell, not executed directly
        exclude: '^zsh/(zlogout|zlogin|zprofile|zshrc|zshenv|zgenom|modules/.*/init\.zsh|environment/.*/(zshenv|zprofile|zshrc))$'
      # Prevent non-permanent VCS permalinks
      - id: check-vcs-permalinks
      # Prevent accidental submodule additions
      - id: forbid-new-submodules

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        # Exclude ZSH files as shellcheck doesn't support ZSH syntax
        exclude: '^(zsh/|lib/.*|.*\.zsh$)'

  # Optional: Markdown linting (disabled by default - uncomment to enable)
  # Note: This enforces strict markdown style which may not fit all preferences
  # - repo: https://github.com/igorshubovych/markdownlint-cli
  #   rev: v0.39.0
  #   hooks:
  #     - id: markdownlint
  #       args: ['--fix']

  # Optional: Makefile linting (disabled by default - uncomment to enable)
  # Note: This enforces standard makefile conventions (all, clean, test targets)
  # which may not be needed for simple dotfile makefiles
  # - repo: https://github.com/mrtazz/checkmake
  #   rev: 0.2.2
  #   hooks:
  #     - id: checkmake
